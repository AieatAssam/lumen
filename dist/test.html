<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lumen Test</title>
<style>
  body { margin: 20px; background: #1a1a2e; color: #eee; font-family: system-ui; }
  canvas { border: 1px solid #333; border-radius: 8px; display: block; }
  button { padding: 10px 24px; margin: 8px 8px 8px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #render { background: #7c3aed; color: white; }
  .stats { margin-top: 12px; font-size: 13px; color: #a1a1aa; }
  .log { margin-top: 8px; font-size: 12px; color: #71717a; max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
<h2>Lumen — Standalone Test</h2>
<canvas id="c" width="640" height="360"></canvas>
<div class="stats" id="stats">Loading...</div>
<button id="render">Render</button>
<button id="scene0">Cornell Box</button>
<button id="scene1">Metal Spheres</button>
<button id="scene2">Glass & Light</button>
<div class="log" id="log"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const statsEl = document.getElementById('stats');
let worker = null;
let rendering = false;

function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function init(sceneId) {
  if (worker) worker.terminate();
  rendering = false;
  log('Creating worker...');
  worker = new Worker('worker.js');

  worker.onmessage = (e) => {
    const msg = e.data;
    switch (msg.type) {
      case 'ready':
        log('WASM ready, initializing scene ' + sceneId);
        worker.postMessage({ type: 'init', width: 640, height: 360, sceneId });
        break;
      case 'log':
        log('[wasm] ' + msg.message);
        break;
      case 'pixels':
        const img = new ImageData(msg.data, msg.width, msg.height);
        ctx.putImageData(img, 0, 0);
        statsEl.textContent = `Samples: ${msg.samples} | ${msg.width}×${msg.height}`;
        break;
      case 'error':
        log('ERROR: ' + msg.message);
        rendering = false;
        break;
    }
  };

  worker.onerror = (e) => log('Worker error: ' + e.message);
}

function startRender() {
  if (!worker) return;
  rendering = true;
  log('Starting render pump...');
  function pump() {
    if (!rendering) return;
    worker.postMessage({ type: 'render', samples: 1 });
    requestAnimationFrame(() => { if (rendering) pump(); });
  }
  pump();
}

document.getElementById('render').onclick = () => { rendering = false; startRender(); };
document.getElementById('scene0').onclick = () => init(0);
document.getElementById('scene1').onclick = () => init(1);
document.getElementById('scene2').onclick = () => init(2);
document.getElementById('render')();

// Start with Cornell Box
log('Standalone test ready');
init(0);
setTimeout(() => startRender(), 2000);
</script>
</body>
</html>
